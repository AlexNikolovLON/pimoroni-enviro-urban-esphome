substitutions:
  pm_default_interval: "10"
  noise_calibration_offset: "89.8"
  temp_default_offset: "-8.0"

esphome:
  name: ha-eviro-urban
  friendly_name: HA Enviro Urban

  on_boot:
    - priority: 1250
      then:
        - lambda: |-
            // Keep Enviro Urban powered
            pinMode(2, OUTPUT);
            digitalWrite(2, HIGH);

            // PMS reset inactive
            pinMode(9, OUTPUT);
            digitalWrite(9, HIGH);

            // PM sensor disabled
            pinMode(10, OUTPUT);
            digitalWrite(10, LOW);

            // 5V boost disabled
            pinMode(11, OUTPUT);
            digitalWrite(11, LOW);

    - priority: 500
      then:
        - delay: 2s
        - lambda: |-
            uint8_t ctrl2 = 0;

            auto err = id(rtc_device).read_register(0x01, &ctrl2, 1);

            if (err == esphome::i2c::ERROR_OK) {
              ESP_LOGI("rtc", "RTC Control_2 before = 0x%02X", ctrl2);

              // Disable PCF85063A CLKOUT
              ctrl2 = (ctrl2 & 0xF8) | 0x07;

              auto werr = id(rtc_device).write_register(0x01, &ctrl2, 1);

              if (werr == esphome::i2c::ERROR_OK) {
                ESP_LOGI("rtc", "RTC CLKOUT disabled");
              } else {
                ESP_LOGW("rtc", "Failed to disable RTC CLKOUT");
              }
            } else {
              ESP_LOGW("rtc", "Failed to read RTC Control_2");
            }

    - priority: -100
      then:
        - delay: 2s
        - lambda: |-
            float restored_offset = id(temp_offset_number).state;

            if (!isnan(restored_offset)) {
              id(temp_offset_cache) = restored_offset;
              ESP_LOGI("bme", "Temperature offset restored = %.1f C", restored_offset);
            } else {
              ESP_LOGW(
                "bme",
                "Temperature offset unavailable, using default %.1f C",
                id(temp_offset_cache)
              );
            }

        - delay: 8s
        - logger.log:
            level: INFO
            format: "BOOT: starting first PM measurement"
        - script.execute: pm_measure_once

rp2:
  board: rpipicow

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  ap:
    ssid: "Enviro Urban Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

i2c:
  - id: i2c_main
    sda: GPIO4
    scl: GPIO5
    frequency: 100kHz
    scan: true

  - id: i2c_pm
    sda: GPIO14
    scl: GPIO15
    frequency: 100kHz
    scan: false

i2c_device:
  - id: rtc_device
    i2c_id: i2c_main
    address: 0x51

  - id: pms_device
    i2c_id: i2c_pm
    address: 0x12

globals:
  - id: pm_elapsed_seconds
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: pm_interval_cache
    type: float
    restore_value: no
    initial_value: "${pm_default_interval}"

  - id: pm_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: temp_offset_cache
    type: float
    restore_value: no
    initial_value: "${temp_default_offset}"

  - id: noise_sampling_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: noise_window_start_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: noise_last_cycle_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: noise_min_voltage
    type: float
    restore_value: no
    initial_value: "3.3"

  - id: noise_max_voltage
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: noise_sample_count
    type: uint32_t
    restore_value: no
    initial_value: "0"

output:
  - platform: gpio
    id: activity_led_output
    pin: GPIO6

  - platform: gpio
    id: pm_sensor_enable
    pin: GPIO10

  - platform: gpio
    id: pm_boost_enable
    pin: GPIO11

light:
  - platform: binary
    id: activity_led
    name: "Enviro Activity LED"
    output: activity_led_output
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: poke_button
    name: "Enviro POKE Button"

    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
      inverted: true

    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms

    on_press:
      - logger.log:
          level: INFO
          format: "Enviro POKE button pressed"

number:
  - platform: template
    id: pm_interval_minutes
    name: "PM Measurement Interval"
    unit_of_measurement: "min"
    icon: mdi:timer-cog
    min_value: 1
    max_value: 120
    step: 1
    optimistic: true
    restore_value: true
    initial_value: ${pm_default_interval}
    mode: box

    set_action:
      - lambda: |-
          id(pm_interval_cache) = x;
          id(pm_elapsed_seconds) = 0;
          ESP_LOGI("pms", "PM interval set to %.0f minutes", x);

  - platform: template
    id: temp_offset_number
    name: "Enviro Temperature Offset"
    unit_of_measurement: "°C"
    icon: mdi:thermometer-plus
    min_value: -15
    max_value: 15
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: ${temp_default_offset}
    mode: box

    set_action:
      - lambda: |-
          id(temp_offset_cache) = x;
          ESP_LOGI("bme", "Temperature offset changed to %.1f C", x);

button:
  - platform: template
    id: pm_read_now
    name: "Take PM Reading Now"
    icon: mdi:air-filter

    on_press:
      - logger.log:
          level: INFO
          format: "Manual PM reading requested"
      - script.execute: pm_measure_once

sensor:
  - platform: bme280_i2c
    id: enviro_bme280
    i2c_id: i2c_main
    address: 0x77
    update_interval: 30s

    temperature:
      id: enviro_temperature
      name: "Enviro Temperature"
      oversampling: 1x
      filters:
        - lambda: |-
            return x + id(temp_offset_cache);

    pressure:
      id: enviro_pressure
      name: "Enviro Pressure"
      oversampling: 1x

    humidity:
      id: enviro_humidity
      name: "Enviro Humidity"
      oversampling: 1x

  - platform: template
    id: enviro_pm1
    name: "Enviro PM1.0"
    unit_of_measurement: "µg/m³"
    device_class: pm1
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: enviro_pm25
    name: "Enviro PM2.5"
    unit_of_measurement: "µg/m³"
    device_class: pm25
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: enviro_pm10
    name: "Enviro PM10"
    unit_of_measurement: "µg/m³"
    device_class: pm10
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: particles_03
    name: "Enviro Particles >0.3um"
    unit_of_measurement: "/L"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: particles_05
    name: "Enviro Particles >0.5um"
    unit_of_measurement: "/L"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: particles_10
    name: "Enviro Particles >1.0um"
    unit_of_measurement: "/L"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: particles_25
    name: "Enviro Particles >2.5um"
    unit_of_measurement: "/L"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: particles_50
    name: "Enviro Particles >5.0um"
    unit_of_measurement: "/L"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: particles_100
    name: "Enviro Particles >10um"
    unit_of_measurement: "/L"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: enviro_noise_vpp
    name: "Enviro Noise Vpp"
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 3
    icon: mdi:waveform
    update_interval: never

  - platform: template
    id: enviro_noise_dbfs
    name: "Enviro Noise dBFS"
    unit_of_measurement: "dB"
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:volume-high
    update_interval: never

  - platform: template
    id: enviro_noise_db
    name: "Enviro Noise dB"
    unit_of_measurement: "dB"
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:volume-high
    update_interval: never

  - platform: wifi_signal
    id: enviro_wifi_signal
    name: "Enviro WiFi Signal"
    update_interval: 60s

  - platform: uptime
    id: enviro_uptime
    name: "Enviro Uptime"
    update_interval: 60s

text_sensor:
  - platform: wifi_info

    ip_address:
      name: "Enviro IP Address"

    ssid:
      name: "Enviro WiFi SSID"

    mac_address:
      name: "Enviro WiFi MAC"

script:
  - id: pm_measure_once
    mode: single

    then:
      - lambda: |-
          id(pm_elapsed_seconds) = 0;
          id(pm_active) = true;
          id(noise_sampling_active) = false;
          id(noise_sample_count) = 0;
          ESP_LOGI("pms", "PM measurement started - microphone suspended");

      - output.turn_on: pm_boost_enable
      - delay: 500ms
      - output.turn_on: pm_sensor_enable

      - logger.log:
          level: INFO
          format: "PM sensor fan started"

      # Reliable particle counts required a longer warm-up.
      - delay: 15s

      # First frame is intentionally discarded.
      - lambda: |-
          uint8_t first_data[32] = {0};

          auto first_err = id(pms_device).read_register(
            0x00,
            first_data,
            sizeof(first_data)
          );

          if (first_err != esphome::i2c::ERROR_OK) {
            ESP_LOGW("pms", "PM first read failed error=%d", (int) first_err);
          } else {
            ESP_LOGD(
              "pms",
              "FIRST DISCARD: "
              "%02X %02X %02X %02X %02X %02X %02X %02X "
              "%02X %02X %02X %02X %02X %02X %02X %02X "
              "%02X %02X %02X %02X %02X %02X %02X %02X "
              "%02X %02X %02X %02X %02X %02X %02X %02X",
              first_data[0], first_data[1], first_data[2], first_data[3],
              first_data[4], first_data[5], first_data[6], first_data[7],
              first_data[8], first_data[9], first_data[10], first_data[11],
              first_data[12], first_data[13], first_data[14], first_data[15],
              first_data[16], first_data[17], first_data[18], first_data[19],
              first_data[20], first_data[21], first_data[22], first_data[23],
              first_data[24], first_data[25], first_data[26], first_data[27],
              first_data[28], first_data[29], first_data[30], first_data[31]
            );
          }

      - delay: 2s

      # Validate and publish the second frame.
      - lambda: |-
          uint8_t data[32] = {0};

          auto err = id(pms_device).read_register(0x00, data, sizeof(data));

          if (err != esphome::i2c::ERROR_OK) {
            ESP_LOGW("pms", "PM second read failed error=%d", (int) err);
            return;
          }

          ESP_LOGD(
            "pms",
            "RAW SECOND: "
            "%02X %02X %02X %02X %02X %02X %02X %02X "
            "%02X %02X %02X %02X %02X %02X %02X %02X "
            "%02X %02X %02X %02X %02X %02X %02X %02X "
            "%02X %02X %02X %02X %02X %02X %02X %02X",
            data[0], data[1], data[2], data[3],
            data[4], data[5], data[6], data[7],
            data[8], data[9], data[10], data[11],
            data[12], data[13], data[14], data[15],
            data[16], data[17], data[18], data[19],
            data[20], data[21], data[22], data[23],
            data[24], data[25], data[26], data[27],
            data[28], data[29], data[30], data[31]
          );

          if (data[0] != 0x42 || data[1] != 0x4D) {
            ESP_LOGW("pms", "Invalid PM header %02X %02X", data[0], data[1]);
            return;
          }

          uint16_t frame_length = ((uint16_t) data[2] << 8) | data[3];

          if (frame_length != 28) {
            ESP_LOGW("pms", "Unexpected PM frame length %u", frame_length);
            return;
          }

          uint16_t calculated_checksum = 0;
          for (int i = 0; i < 30; i++) {
            calculated_checksum += data[i];
          }

          uint16_t received_checksum = ((uint16_t) data[30] << 8) | data[31];

          if (calculated_checksum != received_checksum) {
            ESP_LOGW(
              "pms",
              "PM checksum failed calculated=%u received=%u",
              calculated_checksum,
              received_checksum
            );
            return;
          }

          // CF=1 / factory values
          uint16_t pm1_cf1 = ((uint16_t) data[4] << 8) | data[5];
          uint16_t pm25_cf1 = ((uint16_t) data[6] << 8) | data[7];
          uint16_t pm10_cf1 = ((uint16_t) data[8] << 8) | data[9];

          // Atmospheric values published to Home Assistant
          uint16_t pm1 = ((uint16_t) data[10] << 8) | data[11];
          uint16_t pm25 = ((uint16_t) data[12] << 8) | data[13];
          uint16_t pm10 = ((uint16_t) data[14] << 8) | data[15];

          // Particle counts, raw unit = particles / 0.1 L
          uint16_t raw_pc03 = ((uint16_t) data[16] << 8) | data[17];
          uint16_t raw_pc05 = ((uint16_t) data[18] << 8) | data[19];
          uint16_t raw_pc10 = ((uint16_t) data[20] << 8) | data[21];
          uint16_t raw_pc25 = ((uint16_t) data[22] << 8) | data[23];
          uint16_t raw_pc50 = ((uint16_t) data[24] << 8) | data[25];
          uint16_t raw_pc100 = ((uint16_t) data[26] << 8) | data[27];

          // Convert /0.1L -> /L
          uint32_t pc03 = (uint32_t) raw_pc03 * 10UL;
          uint32_t pc05 = (uint32_t) raw_pc05 * 10UL;
          uint32_t pc10 = (uint32_t) raw_pc10 * 10UL;
          uint32_t pc25 = (uint32_t) raw_pc25 * 10UL;
          uint32_t pc50 = (uint32_t) raw_pc50 * 10UL;
          uint32_t pc100 = (uint32_t) raw_pc100 * 10UL;

          id(enviro_pm1)->publish_state(pm1);
          id(enviro_pm25)->publish_state(pm25);
          id(enviro_pm10)->publish_state(pm10);

          id(particles_03)->publish_state(pc03);
          id(particles_05)->publish_state(pc05);
          id(particles_10)->publish_state(pc10);
          id(particles_25)->publish_state(pc25);
          id(particles_50)->publish_state(pc50);
          id(particles_100)->publish_state(pc100);

          ESP_LOGI(
            "pms",
            "PM atmospheric: PM1=%u PM2.5=%u PM10=%u ug/m3",
            pm1,
            pm25,
            pm10
          );

          ESP_LOGD(
            "pms",
            "PM CF1: PM1=%u PM2.5=%u PM10=%u ug/m3",
            pm1_cf1,
            pm25_cf1,
            pm10_cf1
          );

          ESP_LOGI(
            "pms",
            "Particles/L: >0.3=%lu >0.5=%lu >1.0=%lu >2.5=%lu >5=%lu >10=%lu",
            (unsigned long) pc03,
            (unsigned long) pc05,
            (unsigned long) pc10,
            (unsigned long) pc25,
            (unsigned long) pc50,
            (unsigned long) pc100
          );

      - output.turn_off: pm_sensor_enable
      - delay: 100ms
      - output.turn_off: pm_boost_enable

      - logger.log:
          level: INFO
          format: "PM sensor powered OFF"

      - delay: 2s

      - lambda: |-
          id(pm_active) = false;
          id(noise_sampling_active) = false;
          id(noise_last_cycle_ms) = 0;
          id(noise_sample_count) = 0;
          ESP_LOGI("pms", "PM measurement finished - microphone resumed");

interval:
  # Non-blocking microphone sampler.
  # ~500 ms sampling window, new result approximately every 5 seconds.
  - interval: 10ms
    then:
      - lambda: |-
          uint32_t now = millis();

          if (id(pm_active)) {
            id(noise_sampling_active) = false;
            id(noise_sample_count) = 0;
            return;
          }

          if (!id(noise_sampling_active)) {
            if (
              id(noise_last_cycle_ms) == 0 ||
              (uint32_t) (now - id(noise_last_cycle_ms)) >= 5000
            ) {
              id(noise_sampling_active) = true;
              id(noise_window_start_ms) = now;
              id(noise_last_cycle_ms) = now;
              id(noise_min_voltage) = 3.3f;
              id(noise_max_voltage) = 0.0f;
              id(noise_sample_count) = 0;
            } else {
              return;
            }
          }

          int raw = analogRead(26);
          float voltage = ((float) raw * 3.3f) / 1023.0f;

          if (voltage < id(noise_min_voltage)) {
            id(noise_min_voltage) = voltage;
          }

          if (voltage > id(noise_max_voltage)) {
            id(noise_max_voltage) = voltage;
          }

          id(noise_sample_count)++;

          if ((uint32_t) (now - id(noise_window_start_ms)) < 500) {
            return;
          }

          id(noise_sampling_active) = false;

          float vpp = id(noise_max_voltage) - id(noise_min_voltage);
          id(enviro_noise_vpp)->publish_state(vpp);

          float dbfs;
          if (vpp <= 0.001f) {
            dbfs = -80.0f;
          } else {
            dbfs = 20.0f * log10f(vpp / 3.3f);
          }

          id(enviro_noise_dbfs)->publish_state(dbfs);

          float db;
          if (vpp <= 0.001f) {
            db = 0.0f;
          } else {
            db = 20.0f * log10f(vpp) + ${noise_calibration_offset}f;
          }

          id(enviro_noise_db)->publish_state(db);

          ESP_LOGD(
            "noise",
            "samples=%u Vpp=%.3fV dBFS=%.1f calibrated=%.1fdB",
            id(noise_sample_count),
            vpp,
            dbfs,
            db
          );

          id(noise_sample_count) = 0;

  - interval: 5s
    then:
      - lambda: |-
          if (!id(pm_active)) {
            id(pm_elapsed_seconds) += 5;
          }

      - if:
          condition:
            lambda: |-
              if (id(pm_active)) {
                return false;
              }

              float minutes = id(pm_interval_cache);

              if (isnan(minutes) || minutes < 1.0f) {
                minutes = ${pm_default_interval};
              }

              uint32_t required_seconds = (uint32_t) (minutes * 60.0f);
              return id(pm_elapsed_seconds) >= required_seconds;

          then:
            - lambda: |-
                id(pm_elapsed_seconds) = 0;
            - script.execute:
                id: pm_measure_once
